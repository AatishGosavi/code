.pb{border:1px solid var(--bd);border-radius:10px;padding:10px;background:var(--bg)}.pt{font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between}.pt span{font-weight:400;color:var(--mu);font-size:12px}

</style></head><body><div id="app"></div><div id="toast"></div><script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const add=(d,n)=>new Date(Date.parse(d)+n*864e5).toISOString().slice(0,10);

const lvDays=(a,b,x)=>{const r=[];if(!a||!b||b<a)return r;for(let d=a,n=0;d<=b&&n<366;d=add(d,1),n++){const w=new Date(d).getUTCDay();if(!(x&&(w==0||w==6)))r.push(d)}return r};
function lvSum(engs){const ok=e=>isL(e)&&(S.all||e.st=='Approved'),fy=fyOf(S.rt),pm=d=>d>=S.rf&&d<=S.rt,pf=d=>fyOf(d)==fy&&d<=S.rt,

 row=u=>`<tr><td>${esc(u.name)}</td>${LTY.map(t=>`<td class="n">${n(u.id,t[0],pm)||'·'}</td>`).join('')}<td class="n"><b>${n(u.id,'',pm)||'·'}</b></td>${LTY.map(t=>`<td class="n">${n(u.id,t[0],pf)||'·'}</td>`).join('')}<td class="n"><b>${n(u.id,'',pf)||'·'}</b></td></tr>`;
 return`<div class="card w"><h3>Leave summary (days) – ${S.rf} to ${S.rt}, and FY ${fy} to date</h3><table><tr><th rowspan="2">Engineer</th><th class="n" colspan="${LTY.length+1}">Selected period</th><th class="n" colspan="${LTY.length+1}">FY ${fy} to date</th></tr><tr>${[0,1].map(()=>LTY.map(t=>`<th class="n">${t[0]}</th>`).join('')+'<th class="n">Total</th>').join('')}</tr>${engs.map(row).join('')}</table><p class="mu" style="font-size:12px">EL = Earned, PL = Privilege, SL = Sick leave. Follows the same Approved / include-pending setting as above.</p></div>`}
function rangeH(){return`<div class="card"><div class="row"><label>From<input type="date" value="${S.rf}" onchange="S.rf=this.value;render()"></label><label>To<input type="date" value="${S.rt}" onchange="S.rt=this.value;render()"></label><span class="mu" style="align-self:center">Quick:</span><button onclick="qr('m')">This month</button><button onclick="qr('p')">Last month</button><button onclick="qr('q')">Last 30 days</button><button onclick="qr('y')">This FY</button></div>${S.rf>S.rt?'<p class="err">From date is after To date.</p>':''}</div>`}
function qr(k){const d=new Date(today),Y=d.getUTCFullYear(),M=d.getUTCMonth(),iso=x=>x.toISOString().slice(0,10);
 if(k=='m'){S.rf=today.slice(0,8)+'01';S.rt=today}
 else if(k=='p'){S.rf=iso(new Date(Date.UTC(Y,M-1,1)));S.rt=iso(new Date(Date.UTC(Y,M,0)))}
 else if(k=='q'){S.rf=add(today,-29);S.rt=today}
 else{S.rf=(M>=3?Y:Y-1)+'-04-01';S.rt=today}render()}
const DIMS={eng:{n:'Engineer',f:r=>U(r.eng).name},proj:{n:'Project',f:r=>r.pno+' '+P(r.pno).name},phase:{n:'Phase',f:r=>r.ph||'General'},task:{n:'Task',f:r=>(r.ph?r.ph+' \u203a ':'')+r.task},mon:{n:'Month',f:r=>r.mon}};
function recs(){const o=[];DB.entries.forEach(e=>{if(!(S.all||e.st=='Approved'))return;if(S.fe&&e.eng!=S.fe)return;if(S.fp&&e.pno!=S.fp)return;if(!S.gen&&e.pno=='GEN-001')return;
 if(isL(e))lvd(e).forEach(d=>o.push({eng:e.eng,pno:e.pno,ph:'',task:'Leave'+(e.lt?' '+e.lt:''),mon:d.slice(0,7),h:0,ld:1}));
 else if(e.date>=S.rf&&e.date<=S.rt)o.push({eng:e.eng,pno:e.pno,ph:e.ph||'',task:e.task,mon:e.date.slice(0,7),h:e.h,ld:0})});return o}
function grp(rs,ds,i){const m={};rs.forEach(r=>{const k=DIMS[ds[i]].f(r);(m[k]=m[k]||[]).push(r)});
 return Object.keys(m).sort().map(k=>({k,h:m[k].reduce((a,r)=>a+r.h,0),ld:m[k].reduce((a,r)=>a+r.ld,0),ch:i+1<ds.length?grp(m[k],ds,i+1):[]}))}
function flat(ns,lv,o,pa=[]){ns.forEach(n=>{const p=[...pa,n.k];o.push({n,lv,path:p});flat(n.ch,lv+1,o,p)});return o}
let RR=[],FO=[];
const fil=(rs,ds)=>rs.filter(r=>ds.every(k=>!(S.hf[k]&&S.hf[k][DIMS[k].f(r)]))),vis=r=>{for(let j=1;j<r.path.length;j++)if(S.col[r.path.slice(0,j).join(' / ')])return false;return true};
function tg(i){const k=RR[i].path.join(' / ');S.col[k]=!S.col[k];render()}

function foH(ds,rs0){FO=ds.map(k=>({dim:k,vals:[...new Set(rs0.map(DIMS[k].f))].sort()}));
 return`<div class="card"><h3>Filter groups <button onclick="S.fo=false;render()" style="float:right">Close</button></h3><div class="row" style="align-items:start">${FO.map((f,di)=>`<div style="min-width:200px"><b>${DIMS[f.dim].n}</b> <button onclick="ha(${di},1)">All</button> <button onclick="ha(${di},0)">None</button><div style="max-height:200px;overflow:auto;margin-top:6px">${f.vals.map((v,vi)=>`<label style="display:flex;flex-direction:row;gap:6px;align-items:center;font-size:13px;color:var(--tx)"><input type="checkbox" ${(S.hf[f.dim]||{})[v]?'':'checked'} onchange="hf(${di},${vi},this.checked)"> ${esc(v)}</label>`).join('')}</div></div>`).join('')}</div></div>`}
function hf(di,vi,on){const f=FO[di];(S.hf[f.dim]=S.hf[f.dim]||{})[f.vals[vi]]=!on;render()}
function ha(di,on){const f=FO[di],o=S.hf[f.dim]=S.hf[f.dim]||{};f.vals.forEach(v=>o[v]=!on);render()}
function rep(){const ds=[...new Set(S.g.filter(Boolean))],rs0=recs(),rs=fil(rs0,ds),nh=ds.reduce((a,k)=>a+Object.values(S.hf[k]||{}).filter(Boolean).length,0),tot=rs.reduce((a,r)=>a+r.h,0),tl=rs.reduce((a,r)=>a+r.ld,0),rows=(RR=ds.length?flat(grp(rs,ds,0),0,[]):[]),
 PRE=[['Engineer › Project › Task',['eng','proj','task']],['Engineer › Project',['eng','proj']],['Engineer › Task',['eng','task']],['Project › Task',['proj','task']],['Project › Engineer',['proj','eng']],['Project › Phase › Task',['proj','phase','task']],['Task › Engineer',['task','eng']],['Month › Engineer',['mon','eng']],['Engineer › Month',['eng','mon']]],
 sel=i=>`<label>Group ${i+1}<select onchange="S.g[${i}]=this.value;render()"><option value="">${i?'— none —':'(no grouping)'}</option>${Object.keys(DIMS).map(k=>`<option value="${k}" ${S.g[i]==k?'selected':''}>${DIMS[k].n}</option>`).join('')}</select></label>`;
 return rangeH()+`<div class="card"><h3>Report builder</h3><div class="row">${[0,1,2].map(sel).join('')}<label>Engineer<select onchange="S.fe=this.value;render()"><option value="">All</option>${DB.users.filter(u=>u.roles.includes('Engineer')).map(u=>`<option value="${u.id}" ${S.fe==u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></label><label>Project<select onchange="S.fp=this.value;render()"><option value="">All</option>${DB.projects.map(p=>`<option value="${esc(p.no)}" ${S.fp==p.no?'selected':''}>${esc(p.no)} ${esc(p.name)}</option>`).join('')}</select></label><label style="flex-direction:row;align-items:center;gap:4px"><input type="checkbox" ${S.gen?'checked':''} onchange="S.gen=this.checked;render()"> Include General (office / leave)</label><label style="flex-direction:row;align-items:center;gap:4px"><input type="checkbox" ${S.all?'checked':''} onchange="S.all=this.checked;render()"> Include pending (Applied)</label><button class="p" onclick="expR()">Export CSV</button></div>
 <div class="row" style="margin-top:10px"><span class="mu" style="align-self:center">Ready-made:</span>${PRE.map(p=>`<button onclick="S.g=[${p[1].map(x=>`'${x}'`).join(',')}];render()">${p[0]}</button>`).join('')}</div></div>
 ${S.fo&&ds.length?foH(ds,rs0):''}<div class="card w"><h3>${ds.map(k=>DIMS[k].n).join(' › ')||'Total'} · ${S.rf} to ${S.rt} <span style="font-weight:400;font-size:12px;margin-left:10px"><button onclick="ea(0)">Expand all</button> <button onclick="ea(1)">Collapse all</button></span></h3>${rs.length?`<table><tr><th>${ds.length?`Group <button class="fb" onclick="S.fo=!S.fo;render()" title="Filter groups"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M3 4h18l-7 8v6l-4 2v-8z"/></svg>${nh?'<b>'+nh+'</b>':''}</button>`:''}</th><th class="n">Hours</th><th class="n">Leave days</th><th class="n">% of hours</th><th></th></tr>${rows.map((r,i)=>vis(r)?`<tr style="${r.n.ch.length?'font-weight:600':''}"><td style="padding-left:${8+r.lv*18}px">${r.n.ch.length?`<span class="tgl" onclick="tg(${i})">${S.col[r.path.join(' / ')]?'+':'−'}</span>`:'<span class="tgl nb"></span>'}${esc(r.n.k)}</td><td class="n">${+r.n.h.toFixed(1)}</td><td class="n">${r.n.ld||'·'}</td><td class="n">${tot?Math.round(r.n.h/tot*100):0}%</td><td style="width:140px"><div class="b" style="height:10px"><u style="width:${tot?r.n.h/tot*100:0}%;background:var(--ac)"></u></div></td></tr>`:'').join('')}<tr><th>Total</th><th class="n">${+tot.toFixed(1)}</th><th class="n">${tl||'·'}</th><th></th><th></th></tr></table><p class="mu" style="font-size:12px">Leave is shown in days (0 hours). Grouped rows are sub-totals of the rows indented under them.</p>`:'<p class="mu">No timesheet data for this selection.</p>'}</div>`}

function expR(){const ds=[...new Set(S.g.filter(Boolean))],rs=fil(recs(),ds);if(!rs.length)return toast('No data to export');const q=s=>'"'+String(s).replace(/"/g,'""')+'"',rows=ds.length?flat(grp(rs,ds,0),0,[]).filter(r=>!r.n.ch.length):[{n:{h:rs.reduce((a,r)=>a+r.h,0),ld:rs.reduce((a,r)=>a+r.ld,0)},path:[]}];
 saveF(`report_${S.rf}_${S.rt}.csv`,[[...ds.map(k=>DIMS[k].n),'Hours','Leave days'].map(q).join(','),...rows.map(r=>[...r.path,r.n.h,r.n.ld].map(q).join(','))].join('\n'))}
const ld=()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')},

 mk(v('pn'),v('pc'),v('pt'),v('ps'),v('pe'),'Not Started',null,{nt:S.nt,f:{unit:v('pu'),po:v('ppo'),pod:v('ppd'),sl:v('psl'),pm:v('ppm'),el:v('pel'),swl:v('pwl'),hfat:v('phf'),sfat:v('psf'),ifat:v('pif'),disp:v('pdd'),comm:v('pcm')}});const p=DB.projects[DB.projects.length-1];S.nt=null;S.np=false;toast('Created '+p.no);render()}
function setSt(n,v){P(n).status=v;render()}function setD(n,k,v){P(n).start&&(P(n)[k]=v);render()}
const hrs=(f)=>DB.entries.filter(f).reduce((a,e)=>a+e.h,0);
function projs(){const m=S.u.role=='manager',l=DB.projects.filter(p=>!p.constant);
 S.nt=S.nt||fresh('A');const form=m?(S.np?formH():`<div class="card"><button class="p" onclick="S.np=true;render()">+ New project</button></div>`):'';
 const rows=[DB.projects[0],...l].map(p=>`<tr class="${m&&!p.constant?'':'k'}" ${m?'':`onclick="S.sel='${p.no}';S.task=null;render()"`}><td>${esc(p.no)}</td><td>${esc(p.name)}</td><td>${esc(p.cust)}${p.unit?' – '+esc(p.unit):''}<br><span class="mu">${esc(p.loc)}</span></td><td>${p.type}</td><td>${m&&!p.constant?`<select onchange="setSt('${p.no}',this.value)">${ST.map(s=>`<option ${s==p.status?'selected':''}>${s}</option>`).join('')}</select>`:tag(p.status)}</td><td>${p.constant?'—':`<span class="tag" style="background:${hl(p).c}">${hl(p).t}</span>`}</td><td>${m&&!p.constant?`<input type="date" value="${p.start}" onchange="setD('${p.no}','start',this.value)"><br><input type="date" value="${p.end}" onchange="setD('${p.no}','end',this.value)">`:(p.start?p.start+' → '+p.end:'—')}</td><td class="n">${p.tasks.length}</td><td class="n">${hrs(e=>e.pno==p.no)}</td><td>${m&&!p.constant?`<button onclick="S.det='${p.no}';render()">Details</button>`:''}</td></tr>`).join('');
 return form+`<div class="card w"><h3>${m?'All projects':'Projects – click one to open its task list'}</h3><table><tr><th>No.</th><th>Name</th><th>Customer</th><th>Type</th><th>Status</th><th>Health</th><th>Dates</th><th class="n">Tasks</th><th class="n">Hours</th><th></th></tr>${rows}</table></div>`}
function open(){const p=P(S.sel),me=S.u.id,mine=DB.entries.filter(e=>e.pno==p.no&&e.eng==me).sort((a,b)=>b.date.localeCompare(a.date));
 const th=t=>hrs(e=>e.pno==p.no&&e.eng==me&&e.task==t.name&&(e.ph||'')==t.ph);
 return`<div class="card"><button onclick="S.sel=null;render()">← Back</button> <b style="margin-left:8px">${esc(p.no)} – ${esc(p.name)}</b> ${tag(p.status)}<p class="mu">${esc(p.cust)}, ${esc(p.loc)} · Type ${p.type}${p.hwp?' · Hardware: '+p.hwp+' · Software: '+p.swp:''}</p>
 <h3>Task list (click a task to log time)</h3>${[...new Set(p.tasks.map(t=>t.ph))].map(ph=>`<div style="margin:6px 0">${ph?`<b>${ph}</b><br>`:''}${p.tasks.map((t,i)=>t.ph==ph?`<span class="t ${S.task===i?'on':''}" onclick="S.task=${i};render()">${esc(t.name)} <span class="mu">${p.constant&&t.name=='Leave'?DB.entries.filter(e=>e.pno==p.no&&e.eng==me&&isL(e)).reduce((a,e)=>a+e.ds.length,0)+' d':th(t)+'h'}${t.est?' / '+t.est+'h':''}</span></span>`:'').join('')}</div>`).join('')}
 ${S.task!=null?(p.status=='Completed'?'<p class="mu">Project is completed – no more entries.</p>':`<div class="row" style="margin-top:12px"><label>Task<input value="${esc((p.tasks[S.task].ph?p.tasks[S.task].ph+' › ':'')+p.tasks[S.task].name)}" disabled></label>${isLT(p,S.task)?`<label>Leave type<select id="lty">${LTY.map(t=>`<option value="${t[0]}">${t[0]} – ${t[1]}</option>`).join('')}</select></label><label>From<input type="date" id="ld" value="${today}" onchange="lvc()"></label><label>To<input type="date" id="lt2" value="${today}" onchange="lvc()"></label><label style="flex-direction:row;align-items:center;gap:4px"><input type="checkbox" id="lx" checked onchange="lvc()"> Exclude Sat/Sun</label>`:`<label>Date<input type="date" id="ld" value="${today}"></label>`}${isLT(p,S.task)?`<label>Days<input id="ldn" disabled style="width:70px" value="${lvDays(today,today,true).length}"></label><span class="mu" style="font-size:12px;align-self:center">Leave is counted in days (0 hours)</span>`:'<label>Hours<input type="number" id="lh" min="0.5" max="24" step="0.5" value="8" style="width:80px"></label>'}<label>Remark<input id="lr"></label><button class="p" onclick="logH()">Add to timesheet</button></div>`):''}</div>
 <div class="card w"><h3>My entries on this project</h3>${tsTable(mine,true)}</div>${p.constant?'':docsH(p.no)}`}
function logH(){const lvT=P(S.sel).constant&&P(S.sel).tasks[S.task].name=='Leave',h=lvT?0:+$('lh').value;if(!$('ld').value||(!lvT&&!(h>0)))return toast('Enter date and hours');let ds=[];if(lvT){ds=lvDays($('ld').value,$('lt2').value,$('lx').checked);if(!ds.length)return toast('Select valid From / To dates (To must not be before From)');if(DB.entries.some(e=>e.eng==S.u.id&&isL(e)&&e.ds.some(d=>ds.includes(d))))return toast('Leave already applied for some of these dates')}
 const day=hrs(e=>e.eng==S.u.id&&e.date==$('ld').value)+h;DB.entries.push({id:DB.seq++,eng:S.u.id,date:$('ld').value,pno:S.sel,task:P(S.sel).tasks[S.task].name,ph:P(S.sel).tasks[S.task].ph,h,rem:$('lr').value,st:'Applied',...(lvT?{to:$('lt2').value,ds,lt:$('lty').value}:{})});toast(day>12?'Submitted for approval (note: '+day+'h on that day)':'Submitted for approval');render()}
function del(id){DB.entries=DB.entries.filter(e=>e.id!=id||e.st=='Approved');render()}
function apvL(){DB.entries.forEach(e=>{if(e.st=='Applied'&&(!S.af||e.eng==S.af)&&(!S.ap||e.pno==S.ap))e.st='Approved'});render()}
function apv(id,eng){DB.entries.forEach(e=>{if(e.st=='Applied'&&((id==null&&eng==null)||e.id==id||e.eng==eng))e.st='Approved'});render()}
function tsTable(l,showDel,m){if(!l.length)return'<p class="mu">No entries.</p>';return`<table><tr><th>Date</th><th>Project</th><th>Task</th><th class="n">Hours</th><th>Remark</th><th>Status</th><th></th></tr>${l.map(e=>`<tr><td>${isL(e)&&e.to!=e.date?e.date+' → '+e.to:e.date}</td><td>${esc(e.pno)}</td><td>${e.ph?e.ph+' › ':''}${esc(e.task)}</td><td class="n">${isL(e)?'Leave'+(e.lt?' '+e.lt:'')+' '+e.ds.length+'d':e.h}</td><td>${esc(e.rem)}</td><td>${stg(e.st)}</td><td>${showDel&&e.st=='Applied'?`<button onclick="del(${e.id})">✕</button>`:''}</td></tr>`).join('')}<tr><th colspan="3">Total</th><th class="n">${l.reduce((a,e)=>a+e.h,0)}h${LD(l,m)?` (${LD(l,m)} leave${LD(l,m)>1?'s':''})`:''}</th><th colspan="3"></th></tr></table>`}
function myts(){const l=DB.entries.filter(e=>e.eng==S.u.id&&inM(e,S.month)).sort((a,b)=>b.date.localeCompare(a.date));
 return`<div class="card"><div class="row"><label>Month<input type="month" value="${S.month}" onchange="S.month=this.value;render()"></label></div></div><div class="card w"><p class="mu">Applied (awaiting approval): <b>${l.filter(e=>e.st=='Applied').reduce((a,e)=>a+e.h,0)}h</b> · Approved: <b>${l.filter(e=>e.st=='Approved').reduce((a,e)=>a+e.h,0)}h</b> · Leaves: <b>${LD(l,S.month)}</b> <span class="mu">${LTY.map(t=>[t[0],l.filter(e=>isL(e)&&e.lt==t[0]).reduce((a,e)=>a+ldays(e,S.month),0)]).filter(x=>x[1]).map(x=>x[0]+' '+x[1]).join(' · ')}</span></p>${tsTable(l,true,S.month)}</div>`}
function tsMgr(){const l=DB.entries.filter(e=>inR(e)&&(S.all||e.st=='Approved')),key=e=>e.pno=='GEN-001'?'Office: '+e.task:e.pno+(e.ph=='Hardware'?' · HW':e.ph=='Software'?' · SW':''),keys=[...new Set(l.map(key))].sort(),col=k=>PAL[keys.indexOf(k)%PAL.length],engs=DB.users.filter(u=>u.roles.includes('Engineer'));
 const tot=u=>l.filter(e=>e.eng==u).reduce((a,e)=>a+e.h,0),lv=u=>l.filter(e=>e.eng==u&&isL(e)).reduce((a,e)=>a+lvd(e).length,0),lt=u=>lv(u)?` (${lv(u)} leave${lv(u)>1?'s':''})`:'',mx=Math.max(1,...engs.map(u=>tot(u.id)));
 const bars=engs.map(u=>`<div class="g"><i>${esc(u.name)} <span class="mu">${tot(u.id)}h${lt(u.id)}</span></i><div class="b" style="flex:1"><div class="b" style="width:${tot(u.id)/mx*100}%">${keys.map(k=>{const h=l.filter(e=>e.eng==u.id&&key(e)==k).reduce((a,e)=>a+e.h,0);return h?`<u style="width:${h/tot(u.id)*100}%;background:${col(k)}" title="${esc(k)}: ${h}h"></u>`:''}).join('')}</div></div></div>`).join('');
 return`${rangeH()}
 <div class="card"><h3>Hours per engineer by project <label style="font-weight:400;font-size:12px;margin-left:8px"><input type="checkbox" ${S.all?'checked':''} onchange="S.all=this.checked;render()"> include pending (Applied)</label></h3>${bars}<div class="lg">${keys.filter(k=>k!='Office: Leave').map(k=>`<span><i style="background:${col(k)}"></i>${esc(k)}</span>`).join('')}</div></div>
 <div class="card w"><h3>Table (hours)</h3><table><tr><th>Engineer</th>${keys.map(k=>`<th class="n">${esc(k)}</th>`).join('')}<th class="n">Total</th></tr>${engs.map(u=>`<tr><td>${esc(u.name)}</td>${keys.map(k=>`<td class="n">${k=='Office: Leave'?(lv(u.id)?lv(u.id)+' d':'·'):(l.filter(e=>e.eng==u.id&&key(e)==k).reduce((a,e)=>a+e.h,0)||'·')}</td>`).join('')}<td class="n"><b>${tot(u.id)}h</b><span class="mu">${lt(u.id)}</span></td></tr>`).join('')}</table><p class="mu" style="font-size:12px">"Office: Leave / Office Work / …" columns come from the constant project GEN-001. Leave is shown in days and counts as 0 hours.</p></div>${lvSum(engs)}`}
function appr(){const pend=DB.entries.filter(e=>e.st=='Applied');if(S.af&&!pend.some(e=>e.eng==S.af))S.af='';if(S.ap&&!pend.some(e=>e.pno==S.ap))S.ap='';const l=pend.filter(e=>(!S.af||e.eng==S.af)&&(!S.ap||e.pno==S.ap)).sort((a,b)=>a.eng.localeCompare(b.eng)||a.date.localeCompare(b.date)),by=[...new Set(pend.map(e=>e.eng))],bp=[...new Set(pend.map(e=>e.pno))];
 return`<div class="card"><h3>Pending approvals (${l.length}${l.length!=pend.length?' of '+pend.length:''})</h3><div class="row"><label>Engineer<select onchange="S.af=this.value;render()"><option value="">All engineers (${pend.length})</option>${by.map(u=>`<option value="${u}" ${S.af==u?'selected':''}>${esc(U(u).name)} (${pend.filter(e=>e.eng==u).length})</option>`).join('')}</select></label><label>Project<select onchange="S.ap=this.value;render()"><option value="">All projects</option>${bp.map(n=>`<option value="${esc(n)}" ${S.ap==n?'selected':''}>${esc(n)} ${esc(P(n).name)} (${pend.filter(e=>e.pno==n).length})</option>`).join('')}</select></label>${l.length?`<button class="p" onclick="apvL()">Approve ${l.length==pend.length?'all':'these '+l.length}</button>`:''}${S.af||S.ap?`<button onclick="S.af='';S.ap='';render()">Clear filters</button>`:''}</div>${l.length?'':'<p class="mu">Nothing pending'+(pend.length?' for this filter.':'.')+'</p>'}</div>${l.length?`<div class="card w"><table><tr><th>Engineer</th><th>Date</th><th>Project</th><th>Task</th><th class="n">Hours</th><th>Remark</th><th></th></tr>${l.map(e=>`<tr><td>${esc(U(e.eng).name)}</td><td>${isL(e)&&e.to!=e.date?e.date+' → '+e.to:e.date}</td><td>${esc(e.pno)}</td><td>${e.ph?e.ph+' › ':''}${esc(e.task)}</td><td class="n">${isL(e)?'Leave'+(e.lt?' '+e.lt:'')+' '+e.ds.length+'d':e.h}</td><td>${esc(e.rem)}</td><td><button onclick="apv(${e.id})">Approve</button></td></tr>`).join('')}</table></div>`:''}`}
function masters(){return`<div class="card"><h3>Customers</h3><div class="w"><table><tr><th>Client name</th><th>Location</th><th>Contact 1</th><th>Contact 2</th><th>Units</th></tr>${DB.customers.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.loc)}</td><td>${esc(c.c1)}</td><td>${esc(c.c2)}</td><td style="white-space:normal">${esc((c.units||[]).join(', '))||'<span class="mu">–</span>'}</td></tr>`).join('')}</table></div><div class="row" style="margin-top:8px"><label>Name<input id="cn"></label><label>Location<input id="cl"></label><label>Contact 1<input id="ck1"></label><label>Contact 2<input id="ck2"></label><label>Units (comma separated)<input id="ck3"></label><button class="p" onclick="addC()">Add customer</button></div></div>
 <div class="card"><h3>Task lists by project type and phase (one task per line)</h3><div class="row">${Object.keys(DB.types).map(t=>PHS.map(ph=>`<label>Type ${t} – ${ph}<textarea id="tt${t}${ph}" rows="6" cols="22">${esc(DB.types[t][ph].join('\n'))}</textarea></label>`).join('')).join('')}<label>Constant project GEN-001<textarea id="ttG" rows="6" cols="22">${esc(DB.projects[0].tasks.map(t=>t.name).join('\n'))}</textarea></label></div><p><button class="p" onclick="saveT()">Save task masters</button> <span class="mu" style="font-size:12px">Applies to projects created from now on.</span></p></div>
 <div class="card w"><h3>Users and roles</h3><table><tr><th>User</th><th>Username</th><th>Password</th>${ROLES.map(r=>`<th>${r}</th>`).join('')}</tr>${DB.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.id)}</td><td><input value="${esc(u.pw)}" style="width:110px" onchange="U('${u.id}').pw=this.value"></td>${ROLES.map(r=>`<td><input type="checkbox" ${u.roles.includes(r)?'checked':''} onchange="setRole('${u.id}','${r}',this.checked)"></td>`).join('')}</tr>`).join('')}</table><p class="mu" style="font-size:12px">One user can hold several roles. Admin = full access (creates projects, approves timesheets, manages masters); Engineer = logs timesheets and can be picked as Project manager, Engineering lead or Software lead; Sales Lead = can be picked as Sales lead. New users get password welcome123.</p><div class="row" style="margin-top:8px"><label>Name<input id="en"></label>${ROLES.map((r,i)=>`<label style="flex-direction:row;align-items:center;gap:4px"><input type="checkbox" id="nr${i}"> ${r}</label>`).join('')}<button class="p" onclick="addE()">Add user</button></div></div>${locH()}`}
function addC(){if(!$('cn').value)return toast('Enter name');DB.customers.push({name:$('cn').value,loc:$('cl').value,c1:$('ck1').value,c2:$('ck2').value,units:$('ck3').value.split(',').map(x=>x.trim()).filter(Boolean)});render()}
function setRole(id,r,on){const u=U(id);if(r=='Admin'&&!on&&u.id==S.u.id){toast('You cannot remove your own Admin role');return render()}u.roles=on?[...new Set([...u.roles,r])]:u.roles.filter(x=>x!=r);u.role=u.roles.includes('Admin')?'manager':'engineer';render()}
function addE(){const n=$('en').value.trim(),r=ROLES.filter((x,i)=>$('nr'+i).checked);if(!n)return toast('Enter name');if(!r.length)return toast('Select at least one role');DB.users.push({id:n.toLowerCase().replace(/\W/g,'')+DB.users.length,name:n,roles:r,pw:'welcome123',role:r.includes('Admin')?'manager':'engineer'});render()}
function saveT(){const f=id=>$(id).value.split('\n').map(s=>s.trim()).filter(Boolean);Object.keys(DB.types).forEach(t=>PHS.forEach(ph=>DB.types[t][ph]=f('tt'+t+ph)));DB.projects[0].tasks=f('ttG').map(n=>({ph:'',name:n,est:0}));toast('Saved');render()}
function render(){const a=$('app');if(!S.u){a.innerHTML=loginH();return}
 const m=S.u.role=='manager',tabs=m?['Dashboard','Projects','Approvals','Timesheets','Attendance','Reports','Masters']:['Projects','My Timesheet','Attendance'];
 let body=S.tab=='Dashboard'?dash():S.tab=='Projects'?(S.det?det():S.sel?open():projs()):S.tab=='Approvals'?appr():S.tab=='Timesheets'?tsMgr():S.tab=='Reports'?rep():S.tab=='Attendance'?(m?attA()+impH():attE()):S.tab=='Masters'?masters():myts();
 a.innerHTML=`<div class="app"><aside class="sb"><div class="br"><span style="font-size:22px">⏱️</span><b>Project &amp; Timesheet</b></div><nav>${tabs.map(t=>`<button class="${t==S.tab?'on':''}" onclick="tab('${t}')">${IC[t]||''}<span>${t}</span>${t=='Approvals'&&NP()?`<em class="bd">${NP()}</em>`:''}</button>`).join('')}</nav><div class="sf"><div class="un">${esc(S.u.name)}<br><small>${S.u.roles.join(', ')}</small></div><button onclick="S.u=null;render()">Logout</button></div></aside><div class="mn"><main>${body}</main></div></div>`}
render();
</script></body></html>
